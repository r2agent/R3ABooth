name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build web (Vite)
        run: npm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK (manual)
        run: |
          # Ubuntu runner sudah preinstall Android SDK di sini
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

          # Cari cmdline-tools
          CMDLINE_TOOLS=$(find $ANDROID_HOME -name "sdkmanager" -type f 2>/dev/null | head -1)
          echo "SDK Manager: $CMDLINE_TOOLS"
          echo "CMDLINE_TOOLS=$CMDLINE_TOOLS" >> $GITHUB_ENV

          # Accept licenses
          yes | $CMDLINE_TOOLS --licenses > /dev/null 2>&1 || true

          # Install platform & build tools
          $CMDLINE_TOOLS "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$(dirname $CMDLINE_TOOLS)" >> $GITHUB_PATH

      - name: Capacitor sync
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build APK (debug)
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: r3abooth-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30